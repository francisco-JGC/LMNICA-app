name: loteria_client_app
description: "LM NICA — aplicación móvil para vendedores (Flutter + Dart)."
publish_to: 'none'
version: 1.3.5+19

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  equatable: ^2.1.0
  esc_pos_utils_plus: ^2.0.4
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.7.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  print_bluetooth_thermal: ^1.2.2
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.3
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4

# Regenerate mobile launcher icons after editing image_path:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # `remove_alpha_ios` desactivado a propósito: el icono usa transparencia
  # en las esquinas y removerla rellena con blanco (feo con el marco
  # dorado del diseño). Como esta app se distribuye APK directo y no por
  # App Store, no hay riesgo de rechazo por alpha en el binario iOS.
  # iOS aplica su propio corner radius al render, así que las esquinas
  # transparentes nunca se ven al usuario.
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/games/
    - assets/icon/app_icon.png
